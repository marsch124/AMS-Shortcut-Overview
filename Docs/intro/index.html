<meta charset="utf-8">
<title>Shortcut Overview Tour</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: chapter rail on the left, coach + a pretend Mac desktop on the right. Reusable tour engine: LESSONS + a small simulator. */
:root {
  --bg: #F6F5F9; --panel: #FFFFFF; --fg: #1E1B2E; --muted: #6A6680; --line: #E3E0EC;
  --accent: #534AB7; --accent-soft: #EEEDFE; --good: #3B6D11; --good-soft: #EAF3DE; --warn: #993C1D;
  --desk-a: #C9D6E3; --desk-b: #E8DCCB; --menubar: rgba(255,255,255,.72); --menubar-fg: #1E1B2E;
  --win: #FFFFFF; --win-bar: #F2F1F5; --win-fg: #1E1B2E; --shadow: 0 18px 40px rgba(30,27,46,.18);
  --purple-fill:#EEEDFE; --purple-title:#3C3489; --purple-text:#26215C; --purple-mark:#534AB7;
  --coral-fill:#FAECE7; --coral-title:#712B13; --coral-text:#4A1B0C; --coral-mark:#993C1D;
  --blue-fill:#E6F1FB; --blue-title:#0C447C; --blue-text:#042C53; --blue-mark:#185FA5;
  --green-fill:#EAF3DE; --green-title:#27500A; --green-text:#173404; --green-mark:#3B6D11;
  --key-bg:#FFFFFF;
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Figtree", -apple-system, "Segoe UI", sans-serif;
  --f-mac: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#15131F; --panel:#1F1C2C; --fg:#EEEDF5; --muted:#A29EB8; --line:#322E44;
  --accent:#AFA9EC; --accent-soft:#2B2650; --good:#97C459; --good-soft:#22331A; --warn:#F0997B;
  --desk-a:#1F2C3D; --desk-b:#3A2F3A; --menubar: rgba(30,28,40,.75); --menubar-fg:#EEEDF5;
  --win:#26232F; --win-bar:#2F2C39; --win-fg:#EEEDF5; --shadow: 0 18px 40px rgba(0,0,0,.5);
  --purple-fill:#3C3489; --purple-title:#CECBF6; --purple-text:#EEEDFE; --purple-mark:#AFA9EC;
  --coral-fill:#712B13; --coral-title:#F5C4B3; --coral-text:#FAECE7; --coral-mark:#F0997B;
  --blue-fill:#0C447C; --blue-title:#B5D4F4; --blue-text:#E6F1FB; --blue-mark:#85B7EB;
  --green-fill:#27500A; --green-title:#C0DD97; --green-text:#EAF3DE; --green-mark:#97C459;
  --key-bg: rgba(0,0,0,.28); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg:#15131F; --panel:#1F1C2C; --fg:#EEEDF5; --muted:#A29EB8; --line:#322E44;
  --accent:#AFA9EC; --accent-soft:#2B2650; --good:#97C459; --good-soft:#22331A; --warn:#F0997B;
  --desk-a:#1F2C3D; --desk-b:#3A2F3A; --menubar: rgba(30,28,40,.75); --menubar-fg:#EEEDF5;
  --win:#26232F; --win-bar:#2F2C39; --win-fg:#EEEDF5; --shadow: 0 18px 40px rgba(0,0,0,.5);
  --purple-fill:#3C3489; --purple-title:#CECBF6; --purple-text:#EEEDFE; --purple-mark:#AFA9EC;
  --coral-fill:#712B13; --coral-title:#F5C4B3; --coral-text:#FAECE7; --coral-mark:#F0997B;
  --blue-fill:#0C447C; --blue-title:#B5D4F4; --blue-text:#E6F1FB; --blue-mark:#85B7EB;
  --green-fill:#27500A; --green-title:#C0DD97; --green-text:#EAF3DE; --green-mark:#97C459;
  --key-bg: rgba(0,0,0,.28); color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 230px minmax(0,1fr); gap: 22px; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none }

/* Rail */
.rail { display: flex; flex-direction: column; gap: 4px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); align-self: start; }
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.brand .tile { width: 40px; height: 40px; border-radius: 10px; background: #534AB7; color: #fff; display: grid; place-items: center; }
.brand .tile svg { width: 26px; height: 26px }
.brand h1 { font-family: var(--f-display); font-size: 19px; line-height: 1.1; margin: 0; text-wrap: balance }
.brand small { color: var(--muted); font-size: 12px }
.chap { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 9px; border: 0; background: none; color: var(--fg); font: inherit; text-align: left; cursor: pointer; }
.chap:hover { background: var(--accent-soft) }
.chap:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.chap .n { color: var(--muted); font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums }
.chap.cur { background: var(--accent-soft); color: var(--accent); font-weight: 600 }
.chap.done .n { color: var(--good) }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin: 10px 2px 2px }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s }
.railnote { color: var(--muted); font-size: 12px; margin: 4px 2px }

/* Coach */
.main { display: flex; flex-direction: column; gap: 14px; min-width: 0 }
.coach { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px 16px; align-items: center; }
.coach .eyebrow { grid-column: 1 / -1; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); font-weight: 600; display: flex; gap: 8px; align-items: center }
.coach .eyebrow .kind { color: var(--muted); font-weight: 500 }
.coach h2 { font-family: var(--f-display); font-size: 23px; line-height: 1.2; margin: 0; text-wrap: balance }
.coach p { margin: 4px 0 0; color: var(--fg); max-width: 62ch }
.coach .btns { display: flex; gap: 8px; align-items: center }
.btn { font: inherit; font-weight: 600; border-radius: 9px; padding: 8px 16px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer }
.btn.main-b { background: #534AB7; border-color: #534AB7; color: #fff }
.btn.main-b:disabled { opacity: .45; cursor: default }
.btn.ghost { border-color: transparent; color: var(--muted) }
.answers { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px }
.ans { font: inherit; padding: 8px 14px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer }
.ans:hover { border-color: var(--accent) }
.ans.right { border-color: var(--good); background: var(--good-soft); color: var(--good); font-weight: 600 }
.ans.wrong { border-color: var(--warn); color: var(--warn); text-decoration: line-through }
.feedback { grid-column: 1 / -1; font-weight: 600; color: var(--good); min-height: 1.4em; margin: 0 }
.feedback.no { color: var(--warn) }
.legend { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px }
.legend button { font: inherit; display: flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 9px; padding: 5px 12px 5px 6px; cursor: pointer }
.legend button.seen { border-color: var(--good) }
.legend .kc { font-family: var(--f-mac); font-size: 16px; min-width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; background: var(--accent-soft); color: var(--accent); font-weight: 600 }
.legend span.nm { color: var(--muted); min-width: 4.5em }
.legend .seen span.nm { color: var(--good); font-weight: 600 }

/* Stage = pretend Mac */
.stagebox { position: relative; width: 100%; aspect-ratio: 960 / 560; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow); max-width: 100% }
.stage { position: absolute; left: 0; top: 0; width: 960px; height: 560px; transform-origin: 0 0; font-family: var(--f-mac); font-size: 13px; color: var(--win-fg);
  background: radial-gradient(120% 90% at 15% 10%, var(--desk-b), transparent 60%), linear-gradient(160deg, var(--desk-a), var(--desk-b)); }
.mbar { position: absolute; inset: 0 0 auto; height: 26px; background: var(--menubar); backdrop-filter: blur(10px); display: flex; align-items: center; gap: 18px; padding: 0 14px; color: var(--menubar-fg); font-size: 13px; z-index: 30 }
.mbar b { font-weight: 700 }
.mbar .sp { flex: 1 }
.mbar .kicon { width: 30px; height: 22px; display: grid; place-items: center; border-radius: 5px; border: 0; background: none; color: inherit; cursor: pointer; padding: 0 }
.mbar .kicon.open, .mbar .kicon:hover { background: rgba(127,127,127,.25) }
.mbar .kicon svg { width: 17px; height: 17px }
.menu { position: absolute; top: 28px; right: 108px; width: 250px; background: var(--win); border-radius: 9px; box-shadow: var(--shadow); padding: 5px; z-index: 40; border: 1px solid var(--line) }
.menu button, .menu .info { display: flex; width: 100%; align-items: center; gap: 6px; border: 0; background: none; color: var(--win-fg); font: inherit; text-align: left; padding: 4px 8px; border-radius: 5px; cursor: pointer }
.menu button:hover { background: #534AB7; color: #fff }
.menu .chk { width: 14px; text-align: center }
.menu .sc { margin-left: auto; opacity: .55 }
.menu .info { color: var(--muted); cursor: default }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px }

.strip { position: absolute; left: 0; right: 0; bottom: 18px; display: flex; justify-content: center; align-items: flex-end; gap: 10px; z-index: 5 }
.card { width: 262px; border-radius: 12px; padding: 8px 10px; background: var(--fill); color: var(--text); display: flex; flex-direction: column; gap: 3px }
.card.purple { --fill: var(--purple-fill); --title: var(--purple-title); --text: var(--purple-text); --mark: var(--purple-mark) }
.card.coral { --fill: var(--coral-fill); --title: var(--coral-title); --text: var(--coral-text); --mark: var(--coral-mark) }
.card.blue { --fill: var(--blue-fill); --title: var(--blue-title); --text: var(--blue-text); --mark: var(--blue-mark) }
.card.green { --fill: var(--green-fill); --title: var(--green-title); --text: var(--green-text); --mark: var(--green-mark) }
.card .hd { display: flex; align-items: center; gap: 6px; margin-bottom: 2px }
.card .hd b { color: var(--title); font-size: 14px }
.card .hd .today { color: var(--mark); font-size: 10.5px; font-weight: 500 }
.card .hd .lrn { margin-left: auto; color: var(--mark); font-size: 10.5px }
.card .plus { border: 0; background: none; color: var(--mark); cursor: pointer; padding: 2px; width: 18px; height: 18px; display: grid; place-items: center; border-radius: 4px; margin-left: auto }
.card .lrn + .plus { margin-left: 0 }
.card .plus svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; fill: none }
.row { display: flex; align-items: center; gap: 6px; min-height: 21px; border-radius: 5px; transition: opacity .3s, transform .3s }
.row.leaving { opacity: 0; transform: translateX(14px) }
.row .tk { width: 16px; height: 16px; border: 0; background: none; padding: 0; cursor: pointer; color: var(--mark); display: grid; place-items: center; flex: none }
.row .tk svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round }
.row .nm { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.row.done .nm { text-decoration: line-through; text-decoration-color: var(--mark) }
.row .rc { font-size: 10px; font-weight: 600; background: var(--mark); color: var(--fill); padding: 0 5px; border-radius: 8px }
.row .keys { margin-left: auto; display: flex; gap: 2px; cursor: default; flex: none }
.k { font: 500 12px/1 ui-rounded, var(--f-mac); min-width: 18px; padding: 3px 4px; text-align: center; border-radius: 4px; background: var(--key-bg); color: var(--title) }
.more { font-size: 10.5px; color: var(--mark) }

/* Windows */
.win { position: absolute; background: var(--win); border-radius: 11px; box-shadow: var(--shadow); border: 1px solid var(--line); overflow: hidden; z-index: 20 }
.win .tb { height: 30px; background: var(--win-bar); display: flex; align-items: center; gap: 7px; padding: 0 11px; font-weight: 600; font-size: 12.5px }
.win .tb .dots { display: flex; gap: 6px; margin-right: 8px }
.win .tb .dots i { width: 11px; height: 11px; border-radius: 50%; background: #E0605A; display: block }
.win .tb .dots i:nth-child(2) { background: #E6B53F } .win .tb .dots i:nth-child(3) { background: #5DBB5A }
.win .tb .ttl { flex: 1; text-align: center; margin-right: 50px; color: var(--muted) }
.cover { left: 80px; top: 60px; width: 800px; height: 470px; transition: transform .6s cubic-bezier(.3,.7,.2,1); cursor: grab }
.cover.away { pointer-events: none; transform: translate(-760px, -380px) scale(.4) }
.cover .body { padding: 26px 34px; color: var(--muted); line-height: 1.8 }
.cover .body .ln { height: 10px; border-radius: 5px; background: var(--line); margin: 14px 0 }
.cover .grab { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); font: 600 15px var(--f-body); color: var(--win-fg); background: var(--win-bar); padding: 10px 16px; border-radius: 10px; border: 1px dashed var(--muted) }

.manage { left: 170px; top: 44px; width: 620px; height: 300px; display: flex; flex-direction: column }
.tabs { display: flex; justify-content: center; gap: 2px; padding: 8px }
.tabs button { font: inherit; font-size: 12.5px; border: 0; background: none; color: var(--win-fg); padding: 3px 10px; border-radius: 6px; cursor: pointer }
.tabs button.on { background: #E6B53F; color: #1E1B2E; font-weight: 600 }
.pane { flex: 1; overflow: auto; padding: 0 18px 8px }
.grp { display: flex; align-items: center; gap: 6px; padding: 7px 0 4px; border-bottom: 1px solid var(--line) }
.grp .dot { width: 11px; height: 11px; border-radius: 50% }
.grp b { font-size: 13.5px }
.grp .acts { margin-left: auto; display: flex; gap: 10px; font-size: 11.5px; color: var(--muted) }
.grp .acts button { border: 0; background: none; font: inherit; color: inherit; cursor: pointer; padding: 1px 3px; border-radius: 4px }
.lrow { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--line); font-size: 12.5px }
.lrow .keys { margin-left: auto; display: flex; gap: 2px }
.lrow .st { color: var(--muted); font-size: 11px }
.foot { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); position: relative }
.foot .sp { flex: 1 }
.mbtn { font: inherit; font-size: 12.5px; padding: 4px 11px; border-radius: 6px; border: 1px solid var(--line); background: var(--win-bar); color: var(--win-fg); cursor: pointer }
.mbtn.prim { background: #534AB7; border-color: #534AB7; color: #fff }
.drop { position: absolute; bottom: 38px; right: 120px; width: 220px; background: var(--win); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 4px; z-index: 5 }
.drop button { display: block; width: 100%; text-align: left; border: 0; background: none; color: var(--win-fg); font: inherit; font-size: 12.5px; padding: 4px 8px; border-radius: 5px; cursor: pointer }
.drop button:hover { background: #534AB7; color: #fff }
.week { color: var(--good); font-size: 13px; padding: 4px 0 6px; font-weight: 600 }
.sheet { position: absolute; inset: 30px 0 0; background: rgba(0,0,0,.18); display: grid; place-items: start center; z-index: 6 }
.sheet .box { margin-top: 30px; width: 300px; background: var(--win); border-radius: 11px; box-shadow: var(--shadow); padding: 16px; text-align: center; border: 1px solid var(--line) }
.sheet .box b { display: block; margin-bottom: 4px }
.sheet .box p { margin: 0 0 12px; color: var(--muted); font-size: 12px }
.sheet .box .r { display: flex; gap: 8px; justify-content: center }
.mbtn.danger { color: #C0392B }

.editor { left: 250px; top: 70px; width: 460px; padding: 0 }
.editor .in { padding: 14px 16px; display: grid; grid-template-columns: 90px 1fr; gap: 9px 10px; align-items: center; font-size: 12.5px }
.editor .lab { color: var(--muted) }
.editor input { font: inherit; padding: 4px 7px; border-radius: 5px; border: 1px solid var(--line); background: var(--win-bar); color: var(--win-fg); width: 100%; min-width: 0 }
.editor .kr { display: flex; gap: 4px }
.editor .kr button { font: inherit; width: 26px; border-radius: 5px; border: 1px solid var(--line); background: var(--win-bar); color: var(--win-fg); cursor: pointer }
.editor .prob { grid-column: 1 / -1; color: #C0392B; min-height: 1em }
.editor .bt { grid-column: 1 / -1; display: flex; gap: 8px; justify-content: flex-end }
.editor .h { grid-column: 1 / -1; font-weight: 700; font-size: 14px; color: var(--blue-mark) }
.editor .looks { display: flex; gap: 2px; --title: var(--blue-title) }
.editor .looks .k { background: var(--blue-fill) }

/* Highlight */
.target { position: relative; z-index: 2; animation: ring 1.6s ease-in-out infinite; border-radius: 7px }
@keyframes ring { 0%,100% { box-shadow: 0 0 0 2px #E6B53F, 0 0 0 6px rgba(230,181,63,.35) } 50% { box-shadow: 0 0 0 2px #E6B53F, 0 0 0 11px rgba(230,181,63,0) } }
@keyframes pop { from { transform: translateY(8px); opacity: .3 } to { transform: none; opacity: 1 } }
.toast { position: absolute; left: 50%; top: 40px; transform: translateX(-50%); background: var(--good); color: #fff; font: 600 14px var(--f-body); padding: 7px 14px; border-radius: 20px; z-index: 50; animation: pop .3s }
:root[data-theme="dark"] .toast { color: #15131F }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .toast { color: #15131F } }

/* Finish */
.finish { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px }
.finish h3 { font-family: var(--f-display); margin: 0 0 8px; font-size: 19px }
.finish label { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; border-top: 1px solid var(--line); cursor: pointer }
.finish input { width: 18px; height: 18px; accent-color: #534AB7; margin-top: 2px; flex: none }

@media (max-width: 820px) {
  .wrap { grid-template-columns: minmax(0,1fr) }
  .rail { position: static; flex-direction: row; flex-wrap: wrap; gap: 4px }
  .brand { width: 100% }
  .chap .n { display: none }
  .railnote, .bar { width: 100% }
  .coach { grid-template-columns: minmax(0,1fr) }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important } }
</style>

<div class="wrap">
  <nav class="rail" id="rail" aria-label="Chapters"></nav>
  <main class="main">
    <section class="coach" id="coach" aria-live="polite"></section>
    <div class="stagebox" id="stagebox"><div class="stage" id="stage"></div></div>
    <section class="finish" id="finish" hidden></section>
  </main>
</div>

<script>

const icon = (n, cls = 'i') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICON[n]}"/></svg>`;

let S = START();

function cardRows(c) {
  const rc = c.rows.filter(r => r.recheck), rest = c.rows.filter(r => !r.recheck);
  if (S.daily) { const order = [3,0,5,1,7,2,6,4]; rest.sort((a, b) => order[c.rows.indexOf(a) % 8] - order[c.rows.indexOf(b) % 8]); }
  return rc.concat(rest);
}
const tickSvg = done => `<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.6"/>${done ? '<path d="M5 8.3 7.1 10.4 11 5.8"/>' : ''}</svg>`;
const caps = (keys, hidden) => keyParts(keys).map(p => `<span class="k">${hidden ? '?' : esc(p)}</span>`).join('');

      <div class="body"><div class="ln" style="width:60%"></div><div class="ln" style="width:85%"></div><div class="ln" style="width:72%"></div><div class="ln" style="width:40%"></div></div>
      <span class="grab">Click this window to move it aside</span></div>`;

  let manage = '';
  if (S.manage) {
    const dotc = c => `var(--${c}-mark)`;
    let pane = '';
    if (S.tab === 'shortcuts') {

        ${c.rows.slice(0, 2).map(r => `<div class="lrow">${esc(r.n)}<span class="keys">${caps(r.k)}</span><span style="color:${dotc(c.colour)}">Change</span></div>`).join('')}

    }
    const missing = ['Raycast','Fusion','Xcode','Safari','Mail','Notes'].filter(n => !S.cards.some(c => c.name === n));
    manage = `<div class="win manage" data-t="manage">
      <div class="tb"><span class="dots"><i data-act="close-manage"></i><i></i><i></i></span><span class="ttl">AMS Shortcut Overview</span></div>

function cleanKeys(k) { return keyParts(k.trim()).map(p => p.length === 1 ? p.toUpperCase() : p).join(' '); }
function findRow(id) { const [cn, rn] = id.split('|'); const c = S.cards.find(c => c.name === cn); return c && { c, r: c.rows.find(r => r.n === rn) }; }

function toast(t) { S.toast = t; renderStage(); clearTimeout(toast.h); toast.h = setTimeout(() => { S.toast = ''; renderStage(); }, 1600); }

/* Clicks inside the pretend Mac */
document.getElementById('stage').addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) { if (S.menu) { S.menu = false; renderStage(); } return; }
  const a = el.dataset.act;
  if (a !== 'kicon' && !a.startsWith('m-') && S.menu) S.menu = false;
  switch (a) {
    case 'cover': if (S.cover) { S.cover = false; renderStage(); emit('uncover'); } break;
    case 'kicon': S.menu = !S.menu; renderStage(); if (S.menu) emit('menu'); break;
    case 'm-quiz': S.quiz = !S.quiz; S.menu = false; if (!S.quiz) S.revealed.clear(); renderStage(); emit('quiz', S.quiz); break;
    case 'm-daily': S.daily = !S.daily; S.menu = false; renderStage(); emit('daily', S.daily); break;
    case 'm-manage': S.menu = false; S.manage = true; S.tab = 'shortcuts'; renderStage(); emit('manage'); break;
    case 'm-add': S.menu = false; openEditor(''); break;
    case 'm-none': S.menu = false; renderStage(); break;
    case 'tick': tick(el.dataset.id); break;
    case 'keys': { const id = el.dataset.id; if (!S.quiz) break; S.revealed.has(id) ? S.revealed.delete(id) : S.revealed.add(id); renderStage(); emit('pin', S.revealed.has(id)); break; }
    case 'plus': openEditor(el.dataset.card); break;
    case 'mod': { const k = document.getElementById('e-keys'); S.editor.keys = (k.value ? k.value + ' ' : '') + el.dataset.m; S.editor.name = document.getElementById('e-name').value; renderStage(); document.getElementById('e-keys').focus(); break; }
    case 'e-cancel': S.editor = null; renderStage(); emit('e-cancel'); break;
    case 'e-save': saveEditor(); break;
    case 'tab': S.tab = el.dataset.tab; S.drop = false; renderStage(); emit('tab', S.tab); break;
    case 'close-manage': S.manage = false; renderStage(); break;
    case 'ready': S.drop = !S.drop; renderStage(); emit('ready'); break;
    case 'pick': { const n = el.dataset.name; S.drop = false;
      const lists = { Safari: [['New tab','⌘ T'],['Close tab','⌘ W'],['Reopen closed tab','⌘ ⇧ T'],['Go to address bar','⌘ L'],['Find on page','⌘ F'],['Reader view','⌘ ⇧ R'],['Next tab','⌃ ⇥'],['Show tab overview','⌘ ⇧ \\']],
        Xcode: [['Build','⌘ B'],['Run','⌘ R'],['Stop','⌘ .'],['Open quickly','⌘ ⇧ O'],['Find in project','⌘ ⇧ F'],['Show or hide navigator','⌘ 0'],['Comment or uncomment line','⌘ /'],['Clean build folder','⌘ ⇧ K']] };
      const rows = (lists[n] || lists.Safari).map(([x, k]) => ({ n: x, k }));
      S.cards.push({ name: n, colour: n === 'Safari' ? 'green' : 'coral', learned: 0, rows }); renderStage(); emit('picked', n); break; }
    case 'remove': S.confirm = el.dataset.card; renderStage(); emit('ask-remove'); break;
    case 'cancel-remove': S.confirm = null; renderStage(); emit('cancel-remove'); break;
    case 'do-remove': S.cards = S.cards.filter(c => c.name !== S.confirm); S.confirm = null; renderStage(); emit('removed'); break;
  }
});

document.getElementById('stage').addEventListener('mouseover', ev => {

document.getElementById('stage').addEventListener('keydown', ev => {

});
document.getElementById('stage').addEventListener('input', ev => {

function tick(id) {
  const f = findRow(id); if (!f || f.r.done) return;
  f.r.done = true; renderStage();
  setTimeout(() => { f.r.leaving = true; renderStage();
    setTimeout(() => {
      const wasRecheck = !!f.r.recheck;
      f.c.rows = f.c.rows.filter(r => r !== f.r); f.c.learned++;
      const prev = S.learnedList.find(l => l.n === f.r.n);
      if (prev) prev.good = true; else { S.learnedList.push({ n: f.r.n, k: f.r.k, good: wasRecheck }); S.week++; }
      renderStage(); emit('tick', { name: f.r.n, recheck: wasRecheck });
    }, 300); }, 600);
}
function openEditor(app) { S.editor = { app, name: '', keys: '', problem: '' }; S.manage = false; renderStage(); emit('editor', app); setTimeout(() => document.getElementById('e-name')?.focus(), 30); }
function saveEditor() {
  const e = S.editor, a = e.app.trim(), n = e.name.trim(), k = cleanKeys(e.keys);
  if (!a) e.problem = "Type the app's name."; else if (!n) e.problem = 'Say what the shortcut does.'; else if (!k) e.problem = 'Type the keys, for example ⌘ ⇧ F.';
  else { let c = S.cards.find(c => c.name.toLowerCase() === a.toLowerCase());
    if (!c) { c = { name: a, colour: 'green', learned: 0, rows: [] }; S.cards.push(c); }
    c.rows.push({ n, k }); S.editor = null; renderStage(); emit('saved', { app: c.name, n }); return; }
  renderStage(); emit('problem');
}

/* ---------- Tour engine (reusable) ---------- */
const SEEN = new Set();
let ci = 0, si = 0, solved = false, targetOff = false;
const store = { get(k) { try { return localStorage.getItem(k) } catch { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch {} } };
let doneChapters = new Set(JSON.parse(store.get('tour-done') || '[]'));

function emit(name, data) {
  const st = LESSONS[ci]?.steps[si]; if (!st || solved || st.kind !== 'try') return;
  if (name === 'menu' && st.menuTarget) { markTarget(st.menuTarget); return; }
  if (name === 'tab' && st.chain && data === 'shortcuts') { markTarget(st.chain[0]); return; }
  if (name === 'ready' && st.chain) { markTarget(st.chain[1]); return; }
  if (name === 'ask-remove' && st.chain) { markTarget(st.chain[0]); return; }
  if ((st.wait === name || st.alt === name) && (name !== 'quiz' || data) && (name !== 'daily' || data) && (name !== 'tab' || data === 'learned')) succeed(st.ok);
  else if (name === 'menu' && st.reopenMenu) markTarget(st.target);
}
function succeed(msg) {
  solved = true; targetOff = true; const fb = document.getElementById('fb'); if (fb) { fb.textContent = '✓ ' + msg; fb.className = 'feedback'; }
  const nx = document.getElementById('next'); if (nx) { nx.disabled = false; nx.focus({ preventScroll: true }); }
}
let curTarget = null;
function markTarget(t) {
  if (t !== undefined) curTarget = t;
  document.querySelectorAll('.target').forEach(e => e.classList.remove('target'));
  if (!curTarget || targetOff) return;
  let el = document.querySelector(`#stage [data-t="${CSS.escape(curTarget)}"]`);
  if (!el && curTarget.startsWith('m-')) el = document.querySelector('#stage [data-t="kicon"]');
  if (el) el.classList.add('target');
}
function renderRail() {
  const total = LESSONS.reduce((n, l) => n + l.steps.length, 0);
  const before = LESSONS.slice(0, ci).reduce((n, l) => n + l.steps.length, 0) + si;
  document.getElementById('rail').innerHTML = `<div class="brand"><span class="tile">${icon('keycap')}</span><div><h1>Shortcut Overview Tour</h1><small>Learn the app in about 8 minutes</small></div></div>
    ${LESSONS.map((l, i) => `<button class="chap ${i === ci ? 'cur' : ''} ${doneChapters.has(i) ? 'done' : ''}" data-ch="${i}">${icon(l.icon)}<span>${l.title}</span><span class="n">${doneChapters.has(i) ? '✓' : l.steps.length + ' steps'}</span></button>`).join('')}
    <button class="chap ${ci === LESSONS.length ? 'cur' : ''}" data-ch="${LESSONS.length}">${icon('trophy')}<span>On your Mac</span></button>
    <div class="bar"><i style="width:${Math.round(100 * Math.min(before, total) / total)}%"></i></div>
    <p class="railnote">Everything here is a practice copy. Nothing changes on your Mac.</p>`;
}
document.getElementById('rail').addEventListener('click', e => { const b = e.target.closest('[data-ch]'); if (b) goChapter(+b.dataset.ch); });

function goChapter(i) {
  ci = i; si = 0; S = START();
  // Bring the pretend Mac to where that chapter starts.
  if (i >= 1) S.cover = false;
  if (i >= 3) { tickNow('Obsidian|Quick switcher', true); }
  if (i >= 4) S.quiz = false;
  if (i >= 6) { S.cards[2].rows.push({ n: 'Desktop folder', k: '⌘ ⇧ D' }); }
  renderStep();
}
function tickNow(id, good) { const f = findRow(id); f.c.rows = f.c.rows.filter(r => r !== f.r); f.c.learned++; S.learnedList.push({ n: f.r.n, k: f.r.k, good }); S.week++; }

function renderStep() {
  renderRail();
  const coach = document.getElementById('coach'), fin = document.getElementById('finish');
  if (ci >= LESSONS.length) { renderFinish(); coach.hidden = true; return; }
  coach.hidden = false; fin.hidden = true;
  const L = LESSONS[ci], st = L.steps[si];
  solved = st.kind === 'look'; targetOff = false;
  if (st.setup) st.setup();
  S.toast = '';
  const kindName = { look: 'Look', try: 'Try it', check: 'Check' }[st.kind];
  coach.innerHTML = `<div class="eyebrow">${icon(L.icon)} ${esc(L.title)} <span class="kind">· ${kindName} · step ${si + 1} of ${L.steps.length}</span></div>
    <div><h2>${esc(st.head)}</h2><p>${esc(st.text)}</p>${st.hint ? `<p style="color:var(--muted);font-size:13px">${esc(st.hint)}</p>` : ''}</div>
    <div class="btns">${ci + si > 0 ? '<button class="btn ghost" id="back">Back</button>' : ''}<button class="btn main-b" id="next" ${solved ? '' : 'disabled'}>${si === L.steps.length - 1 ? 'Finish chapter' : 'Next'}</button></div>
    ${st.legend ? `<div class="legend">${[['⌘','Command'],['⌥','Option'],['⌃','Control'],['⇧','Shift']].map(([k, n]) => `<button data-k="${k}" class="${SEEN.has(k) ? 'seen' : ''}"><span class="kc">${k}</span><span class="nm">${SEEN.has(k) ? n : '?'}</span></button>`).join('')}</div>` : ''}
    ${st.kind === 'check' ? `<div class="answers">${st.answers.map((a, i) => `<button class="ans" data-a="${i}">${esc(a)}</button>`).join('')}</div>` : ''}
    <p class="feedback" id="fb"></p>`;
  curTarget = st.target || null;
  renderStage();
  if (st.legend) coach.querySelectorAll('.legend button').forEach(b => b.onclick = () => {
    SEEN.add(b.dataset.k); b.classList.add('seen'); b.querySelector('.nm').textContent = { '⌘':'Command','⌥':'Option','⌃':'Control','⇧':'Shift' }[b.dataset.k];
    if (SEEN.size === 4) succeed(st.ok);
  });
  if (st.kind === 'check') coach.querySelectorAll('.ans').forEach(b => b.onclick = () => {
    const fb = document.getElementById('fb');
    if (+b.dataset.a === st.right) { coach.querySelectorAll('.ans').forEach(x => x.disabled = true); b.classList.add('right'); succeed(st.ok); }
    else { b.classList.add('wrong'); fb.textContent = 'Not quite. Try another answer.'; fb.className = 'feedback no'; }
  });
  document.getElementById('next').onclick = next;
  const bk = document.getElementById('back'); if (bk) bk.onclick = back;
}
function next() {
  const L = LESSONS[ci];
  if (si < L.steps.length - 1) { si++; renderStep(); return; }
  doneChapters.add(ci); store.set('tour-done', JSON.stringify([...doneChapters]));
  ci++; si = 0; renderStep();
}
function back() { if (si > 0) { si--; solved = true; renderStep(); } else if (ci > 0) { goChapter(ci - 1); } }

function renderFinish() {
  const fin = document.getElementById('finish'); fin.hidden = false;
  S.manage = false; S.menu = false; S.editor = null; S.cover = false; curTarget = null; renderStage();
  const items = ['Click the keyboard-key icon in your menu bar. (If you cannot see it, Tidy Bar may have tucked it away.)',
    'Show the desktop and tick one shortcut you already know.',
    'Point at a "?" key to check yourself (Quiz me is on).',
    'Add one shortcut of your own with the + on a card.'];
  let ticks = JSON.parse(store.get('tour-real') || '[]');
  fin.innerHTML = `<h3>Now try it on your real Mac</h3>${items.map((t, i) => `<label><input type="checkbox" id="real-${i}" ${ticks.includes(i) ? 'checked' : ''}><span>${esc(t)}</span></label>`).join('')}
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn main-b" id="again">Start the tour again</button></div>`;
  fin.querySelectorAll('input').forEach((c, i) => c.onchange = () => { ticks = ticks.filter(x => x !== i); if (c.checked) ticks.push(i); store.set('tour-real', JSON.stringify(ticks)); });
  document.getElementById('again').onclick = () => goChapter(0);
}

/* Fit the 960×560 pretend Mac into its box */
function fit() { const box = document.getElementById('stagebox'); document.getElementById('stage').style.transform = `scale(${box.clientWidth / 960})`; }
new ResizeObserver(fit).observe(document.getElementById('stagebox'));
document.addEventListener('keydown', e => { if (e.key === 'Enter' && !S.editor && e.target.tagName !== 'INPUT') { const n = document.getElementById('next'); if (n && !n.disabled && document.activeElement !== n) n.click(); } });
renderStep(); fit();
</script>
